function evidenceBoardMarkup(editable=false){const b=boardSlots(),all=storySentences(cases[state.caseIndex].passage),ids=state.answers.evidenceIndices||[];const pending=state.answers.pendingBoardClue;return `<section id="evidence-board" class="panel evidence-board"><h3>🗂️ My Evidence Board</h3><p>${editable?'Click sentences in the PDF to collect clues, then put the strongest details into these boxes.':'Use these organized clues to help with your writing.'} <strong>${b.filter(x=>x!==null).length}/${b.length} boxes filled</strong></p>${boardPrompts().map((prompt,i)=>`<div class="evidence-slot"><h4>${state.caseIndex===2?['First','Next','Then','Finally'][i]:'Evidence #'+(i+1)} ${i>=2&&state.caseIndex!==2?'<small>optional</small>':''}</h4><p class="tiny">${escapeHtml(prompt)}</p>${b[i]!==null?`<p class="saved-evidence">“${escapeHtml(all[b[i]]||'')}”</p>${editable?`<button onclick="boardClear(${i})">Remove from box</button>`:''}`:editable?'<p class="empty-evidence">Choose a clue below to fill this box.</p>':'<p class="empty-evidence">No clue selected</p>'}${editable?`<div class="board-picker"><label for="board-select-${i}">Choose a collected clue</label><select id="board-select-${i}" onchange="if(this.value!=='')boardPlace(${i},Number(this.value))"><option value="">${b[i]===null?'Select a clue…':'Replace this clue…'}</option>${ids.map(id=>`<option value="${id}">${escapeHtml((all[id]||'').slice(0,115))}</option>`).join('')}</select></div>`:''}</div>`).join('')}${editable&&Number.isInteger(pending)?`<p class="tiny">New clue collected! Choose which box it belongs in using the menus above.</p>`:''}</section>`}
function boardReady(){const b=boardSlots();return b[0]!==null&&b[1]!==null}


/* Three writing structures, chosen by the investigation question. */
const writingTypes=['evidence','evidence','sequence','sequence','evidence','evidence','evidence','evidence','evidence','change','change','sequence','change','evidence','evidence'];
function writingType(){return writingTypes[state.caseIndex]}
const structurePrompts={
 3:['First, what happens to food in the mouth?','Next, where does food travel?','Then, what happens in the stomach?','Finally, what happens in the intestines?'],
 11:['First, what problem needs solving?','Next, what does the character test?','Then, what does the experiment reveal?','Finally, how is the problem solved?'],
 9:['At first, how do the characters feel about the food?','What happens that changes their minds?','By the end, how do they feel?'],
 10:['How does Amy feel at first?','What happens that changes her feelings?','How does Amy feel later?'],
 12:['How does Reigner feel at first?','What happens that changes his feelings?','How does he feel by the end?']
};
function stageLabels(){return writingType()==='change'?['At first,','Then,','By the end,']:['First,','Next,','Then,','Finally,']}
function stagePrompts(){return structurePrompts[state.caseIndex]||[]}
function stageResponse(i){return (state.answers.structureStages||[])[i]||''}
function stageText(i){const v=stageResponse(i).trim();if(!v)return '';const label=stageLabels()[i];return /^(first|next|then|finally|at first|by the end)\b/i.test(v)?v:label+' '+v}
function stageSave(i,v){const a=state.answers;a.structureStages=a.structureStages||[];a.structureStages[i]=v;saveProgress()}
function clueCards(includeExplanations){const a=state.answers,ids=a.evidenceIndices||[],sentences=storySentences(cases[state.caseIndex].passage);a.clueReasons=a.clueReasons||{};return `<div class="clue-cards">${ids.map((id,i)=>`<div class="clue-reason-card"><div class="clue-head"><strong>🔎 Clue ${i+1}</strong>${state.step===1?`<button type="button" onclick="pickEvidence(${id})">Remove</button>`:''}</div><p class="clue-quote">${escapeHtml(sentences[id]||'')}</p>${includeExplanations?`<label for="reason-${id}"><strong>How does this clue support your answer?</strong></label><textarea id="reason-${id}" placeholder="This shows that..." oninput="saveClueReason(${id},this.value)">${escapeHtml(a.clueReasons[id]||'')}</textarea>`:''}${a.cluesChecked&&state.step===1?`<p class="tiny">${clueFeedback(id)}</p>`:''}</div>`).join('')||'<p>Click a sentence in the PDF above to collect your first clue.</p>'}</div>`}
function saveClueReason(id,v){state.answers.clueReasons=state.answers.clueReasons||{};state.answers.clueReasons[id]=v;saveProgress()}
function newCollectStep(){const a=state.answers,ids=a.evidenceIndices||[],type=writingType();const explanation=type==='evidence';shell(`<h2>🔍 Step 4: Collect Clues</h2><p>Click useful sentences in the story PDF. Each click adds a clue below. ${explanation?'Under each clue, explain how it helps answer the question.':'For this question, you will organize the events in order later. You do not need to explain every clue.'}</p><div class="panel"><h3>My Collected Clues (${ids.length}/${clueLimit()})</h3><div class="wordbank"><strong>🎯 My Answer</strong><p>${escapeHtml(a.answer||'')}</p><p class="tiny">Look for clues that support this answer. You can revise it by going back to Step 3.</p></div>${clueCards(explanation)}${clueLimit()<maxClues()?`<button type="button" onclick="addClueSlot()">＋ Space for Another Clue</button>`:''}${clueCoverageNote(ids)}${a.cluesChecked&&!ids.some(id=>clueRating(id)==='strong')?`<label for="clueReflection">How might one clue help?</label><textarea id="clueReflection" oninput="changeClueReflection(this.value)">${escapeHtml(a.clueReflection||'')}</textarea>`:''}<p role="status">${escapeHtml(a.clueMessage||'')}</p><div class="toolbar"><button ${ids.length?'':'disabled'} onclick="checkMyClues()">🔎 Check My Clues</button><button class="primary" ${ids.length>=2?'':'disabled'} onclick="continueWithClues()">Organize My Evidence →</button></div></div>`)}
function focusWorkspaceClue(id){document.querySelectorAll('.workspace-clue').forEach(el=>el.classList.toggle('focused',el.dataset.clue===String(id)));document.querySelectorAll('.workspace-clue').forEach(el=>el.setAttribute('aria-pressed',el.dataset.clue===String(id)?'true':'false'));}
function workspaceClues(){const a=state.answers,ids=a.evidenceIndices||[],sentences=storySentences(cases[state.caseIndex].passage);return `<aside class="workspace-left"><div class="workspace-sticky"><h3>🔎 My Saved Clues</h3><p class="tiny">Click a clue to focus on it while writing.</p><div class="workspace-clue-list">${ids.map((id,i)=>`<button type="button" class="workspace-clue" data-clue="${id}" aria-pressed="false" onclick="focusWorkspaceClue(${id})"><strong>Clue ${i+1}</strong><span>“${escapeHtml(sentences[id]||'')}”</span></button>`).join('')||'<p>No clues saved yet. Go back to Step 4 to collect clues.</p>'}</div></div></aside>`}
function newCiteStep(){const a=state.answers,type=writingType();if(type==='evidence'){
 const ids=a.evidenceIndices||[];a.clueReasons=a.clueReasons||{};
 const fields=ids.map((id,i)=>`<div class="workspace-write-card"><h3>✏️ Explanation ${i+1}</h3><p class="tiny">How does Clue ${i+1} support your answer?</p><textarea id="reason-${id}" placeholder="This shows that..." onfocus="focusWorkspaceClue(${id})" oninput="saveClueReason(${id},this.value)">${escapeHtml(a.clueReasons[id]||'')}</textarea></div>`).join('');
 shell(`<h2>📖 Step 5: Organize Your Evidence</h2><p>Look at each clue on the left. Explain how it helps answer the question in the matching box on the right.</p><div class="workspace-layout">${workspaceClues()}<section class="workspace-right"><h3>✏️ My Explanations</h3>${fields}<button class="primary" onclick="saveCluePairs()">Use My Evidence & Explanations →</button></section></div>`);return;
 }
 const labels=stageLabels(),prompts=stagePrompts();const fields=labels.map((label,i)=>`<div class="workspace-write-card"><h3>${escapeHtml(label)}</h3><p>${escapeHtml(prompts[i]||'What happens at this stage?')}</p><textarea id="structure-${i}" placeholder="${escapeHtml(label)} ..." oninput="stageSave(${i},this.value)">${escapeHtml(stageResponse(i))}</textarea></div>`).join('');
 shell(`<h2>${type==='sequence'?'🔢 Step 5: Explain the Steps':'🔄 Step 5: Show How Things Change'}</h2><p>${type==='sequence'?'Tell what happens in order. You do not need a separate explanation for every step.':'Show how things were at first, what caused a change, and how things were by the end.'}</p><div class="workspace-layout">${workspaceClues()}<section class="workspace-right"><h3>✏️ ${type==='sequence'?'My Sequence':'My Change Over Time'}</h3>${fields}<button class="primary" onclick="saveStages()">Save My ${type==='sequence'?'Sequence':'Change'} →</button></section></div>`);
}
function saveCluePairs(){const a=state.answers,ids=a.evidenceIndices||[],all=storySentences(cases[state.caseIndex].passage);if(ids.length<2){alert('Collect at least two clues first.');return}for(const id of ids.slice(0,2)){if((a.clueReasons?.[id]||'').trim().split(/\s+/).length<4){alert('Explain how each of your first two clues supports your answer.');document.getElementById('reason-'+id)?.focus();return}}
 a.noteEvidence=ids.map((id,i)=>`According to the text, “${all[id]}”`).join(' ');a.explanation=ids.map(id=>(a.clueReasons?.[id]||'').trim()).filter(Boolean).join(' ');a.noteExplain=a.explanation;state.step=5;render();}
function saveStages(){const labels=stageLabels();for(let i=0;i<labels.length;i++){const v=(document.getElementById('structure-'+i)?.value||'').trim();stageSave(i,v);if(v.split(/\s+/).length<3){alert('Write what happens for '+labels[i]);document.getElementById('structure-'+i)?.focus();return}}
 state.answers.noteEvidence=labels.map((_,i)=>stageText(i)).join(' ');state.answers.explanation='';state.step=5;render();}
function newExplainStep(){const a=state.answers,type=writingType();if(type==='evidence'){
 shell(`<h2>💡 Step 6: Review & Explain</h2><p>Check that each explanation tells <strong>how</strong> the clue supports your answer. You can edit them here. You do not need to explain everything again.</p><div class="wordbank"><strong>My Answer</strong><p>${escapeHtml(a.answer||'')}</p></div>${clueCards(true)}<button class="primary" onclick="saveEvidenceReview()">My Evidence & Explanations Are Ready →</button>`);return;
 }
 shell(`<h2>${type==='sequence'?'🔢 Step 6: Check Your Sequence':'🔄 Step 6: Explain the Change'}</h2><p>Read your ${type==='sequence'?'steps in order':'beginning, turning point, and ending'}.</p><div class="wordbank">${stageLabels().map((_,i)=>`<p>${escapeHtml(stageText(i))}</p>`).join('')}</div><label for="structure-conclusion"><strong>${type==='sequence'?'Optional concluding sentence':'What caused the change? Explain why it matters.'}</strong></label><textarea id="structure-conclusion" placeholder="${type==='sequence'?'Overall, ...':'This change happened because...'}" oninput="state.answers.explanation=this.value;state.answers.noteExplain=this.value">${escapeHtml(a.explanation||'')}</textarea><button class="primary" onclick="saveStructureConclusion()">Continue to My Final Paragraph →</button>`);
}
function saveEvidenceReview(){const a=state.answers,ids=a.evidenceIndices||[],all=storySentences(cases[state.caseIndex].passage);for(const id of ids.slice(0,2))if((a.clueReasons?.[id]||'').trim().split(/\s+/).length<4){alert('Add an explanation for each of your first two clues.');return}a.noteEvidence=ids.map(id=>`According to the text, “${all[id]}”`).join(' ');a.explanation=ids.map(id=>(a.clueReasons?.[id]||'').trim()).filter(Boolean).join(' ');a.noteExplain=a.explanation;state.step=6;render()}
function saveStructureConclusion(){const type=writingType(),v=(document.getElementById('structure-conclusion')?.value||'').trim();if(type==='change'&&v.split(/\s+/).length<5){alert('Explain what caused the change and why it matters.');return}state.answers.explanation=v;state.answers.noteExplain=v;state.step=6;render()}
function structuredParagraph(){const a=state.answers,type=writingType();
 if(type!=='evidence')return [a.answer,...stageLabels().map((_,i)=>stageText(i)),a.explanation].filter(Boolean).join(' ');
 const ids=a.evidenceIndices||[],all=storySentences(cases[state.caseIndex].passage);return [a.answer,...ids.flatMap(id=>[`According to the text, “${all[id]}”`,(a.clueReasons?.[id]||'').trim()])].filter(Boolean).join(' ')}


/* Student-authored sentence-strip workshop. Every strip is drawn from existing notes. */
let draggedStripId=null;
function stripSourcePieces(){
 const a=state.answers,type=writingType(),pieces=[];
 if((a.answer||'').trim())pieces.push({id:'topic',label:'My topic sentence',text:a.answer.trim()});
 if(type==='evidence'){
  const ids=a.evidenceIndices||[],all=storySentences(cases[state.caseIndex].passage);
  ids.forEach((id,i)=>{
   const quote=all[id];if(quote)pieces.push({id:'e'+id,label:'Evidence '+(i+1),text:'According to the text, “'+quote+'”'});
   const reason=(a.clueReasons?.[id]||'').trim();if(reason)pieces.push({id:'x'+id,label:'Explanation '+(i+1),text:reason});
  });
 }else{
  stageLabels().forEach((_,i)=>{const t=stageText(i);if(t)pieces.push({id:'stage'+i,label:type==='change'?'Change '+(i+1):'Step '+(i+1),text:t})});
  if((a.explanation||'').trim())pieces.push({id:'conclusion',label:type==='change'?'What caused the change':'Closing sentence',text:a.explanation.trim()});
 }
 return pieces;
}
function stripPieces(){
 const a=state.answers,src=stripSourcePieces();
 if(!a.stripOrder){a.stripOrder=src.map(x=>x.id).reverse()}
 const rank=id=>{const n=a.stripOrder.indexOf(id);return n<0?999:n};
 return src.sort((x,y)=>rank(x.id)-rank(y.id));
}
function stripSaveOrder(ids){state.answers.stripOrder=ids;saveProgress()}
function stripMove(from,to){const p=stripPieces(),ids=p.map(x=>x.id);if(from<0||to<0||from>=ids.length||to>=ids.length||from===to)return;const [v]=ids.splice(from,1);ids.splice(to,0,v);stripSaveOrder(ids);stripRefresh()}
function stripDragStart(e,id){draggedStripId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('strip-dragging')}
function stripDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('strip-drop-target')}
function stripDrop(e,id){e.preventDefault();const source=draggedStripId||e.dataTransfer.getData('text/plain');draggedStripId=null;const ids=stripPieces().map(x=>x.id);stripMove(ids.indexOf(source),ids.indexOf(id))}
function stripDragEnd(){draggedStripId=null;document.querySelectorAll('.strip-dragging,.strip-drop-target').forEach(el=>el.classList.remove('strip-dragging','strip-drop-target'))}
function stripCards(){const pieces=stripPieces();return pieces.map((p,i)=>`<div class="student-strip" draggable="true" ondragstart="stripDragStart(event,'${p.id}')" ondragover="stripDragOver(event)" ondragleave="this.classList.remove('strip-drop-target')" ondrop="stripDrop(event,'${p.id}')" ondragend="stripDragEnd()" aria-label="${escapeHtml(p.label)} sentence strip"><div class="strip-handle" aria-hidden="true">⠿</div><div class="strip-body"><strong>${escapeHtml(p.label)}</strong><p>${escapeHtml(p.text)}</p></div><div class="strip-controls"><button type="button" aria-label="Move ${escapeHtml(p.label)} up" ${i===0?'disabled':''} onclick="stripMove(${i},${i-1})">↑</button><button type="button" aria-label="Move ${escapeHtml(p.label)} down" ${i===pieces.length-1?'disabled':''} onclick="stripMove(${i},${i+1})">↓</button></div></div>`).join('')}
function stripRefresh(){const list=$('sentence-strip-list');if(list)list.innerHTML=stripCards();const preview=$('sentence-strip-preview');if(preview)preview.textContent=stripPieces().map(x=>x.text).join(' ')}
function setWorkshopMode(mode){const box=$('full');if(box)state.answers.full=box.value;state.answers.workshopMode=mode;saveProgress();render()}
function useArrangedStrips(){const pieces=stripPieces();if(pieces.length<2){alert('Write your topic sentence and collect your evidence before building your paragraph.');return}const box=$('full');if(!box)return;if(box.value.trim()&&!confirm('Replace the current final paragraph with your arranged sentence strips?'))return;box.value=pieces.map(p=>p.text).join(' ');state.answers.full=box.value;saveProgress();const msg=$('strip-message');if(msg)msg.textContent='Your sentence strips are now your paragraph. Read it and revise any wording you want.';box.focus()}
function renderSentenceWorkshop(){
 const a=state.answers,mode=a.workshopMode||'strips',pieces=stripPieces();
 shell(`<h2>🧩 Step 6: Organize Your Paragraph</h2><p>Use the writing you already created. <strong>No new explanations needed.</strong> Put your topic sentence first, and keep each clue near its explanation.</p><div class="workshop-modes" role="group" aria-label="Choose writing mode"><button type="button" class="${mode==='strips'?'selected-mode':''}" onclick="setWorkshopMode('strips')">🧩 Sentence Strip Mode</button><button type="button" class="${mode==='independent'?'selected-mode':''}" onclick="setWorkshopMode('independent')">✏️ Independent Writing</button></div>${mode==='strips'?`<section class="panel"><h3>Arrange Your Sentence Strips</h3><p>Drag the strips or use the ↑ and ↓ buttons to choose the order.</p><div id="sentence-strip-list">${stripCards()}</div><div class="panel strip-preview-panel"><h3>My Paragraph Preview</h3><p id="sentence-strip-preview">${escapeHtml(pieces.map(p=>p.text).join(' '))}</p></div><button type="button" class="primary" onclick="useArrangedStrips()">✓ Use My Arranged Strips</button><p id="strip-message" role="status" class="tiny">The paragraph will be editable in the next step.</p></section>`:`<section class="panel"><h3>My Writing Notes</h3><p>Read your notes below. You'll type your paragraph independently in the next step.</p>${pieces.map(p=>`<div class="plan-part"><strong>${escapeHtml(p.label)}</strong><p>${escapeHtml(p.text)}</p></div>`).join('')}</section>`}<button class="primary" type="button" onclick="goToRevision()">Next: Revise My Paragraph →</button>`);
}
function goToRevision(){state.step=6;saveProgress();render()}
function renderRevisionStep(){
 const a=state.answers,mode=a.workshopMode||'strips';
 shell(`<h2>✏️ Step 7: Revise & Submit</h2><p>Read your paragraph. Improve wording, check the order, and make sure each clue supports your answer. You do not need to explain your evidence again.</p>${revisionReminder()}<div class="panel"><h3>🗂️ My Writing Pieces</h3><details><summary>Review my organized sentences</summary>${stripPieces().map(p=>`<div class="plan-part"><strong>${escapeHtml(p.label)}</strong><p>${escapeHtml(p.text)}</p></div>`).join('')}</details></div><label for="full"><strong>My final paragraph</strong></label><textarea spellcheck="true" autocorrect="on" autocomplete="on" id="full" style="min-height:220px;font-size:18px;line-height:1.65" placeholder="${mode==='strips'?'Go back to Step 6 to use your sentence strips, or type your paragraph here.':'Write your paragraph using your notes.'}" oninput="state.answers.full=this.value;saveProgress();const e=$('finalGuardrail');if(e)e.textContent=''">${escapeHtml(a.full||'')}</textarea><div class="toolbar"><button type="button" onclick="readMyAnswer()">🔊 Hear My Answer</button><button type="button" onclick="stopReading()">⏹ Stop Reading</button><button type="button" onclick="clearFinalDraft()">🗑️ Start Paragraph Over</button></div>${checklistMarkup()}${saveNotice()}<div class="toolbar"><button type="button" onclick="exportResponse()">⬇️ Save Response as Text</button><button type="button" onclick="window.print()">🖨️ Print</button></div><p id="finalGuardrail" role="status"></p><button type="button" class="primary" onclick="submitInspected();return false">🧑‍🏫 Ready for Teacher Check →</button>`);
}

function render(){saveProgress();const c=cases[state.caseIndex],a=state.answers,s=state.step; if(a.guardrailRequest && a.guardrailRequest.step!==s)a.guardrailRequest=null;
if(s===1){newCollectStep();return}
if(s===4){newCiteStep();return}
if(s===5){renderSentenceWorkshop();return}
if(s===0){const quiz=questionChecks[state.caseIndex];const page=a.preReadPage===1?1:0;const options=page===0?quiz.meaning:quiz.clues;const chosen=page===0?a.meaningChoice:a.clueChoice;const prompt=page===0?'What is this question asking you to explain?':'What clues should you look for as you read?';const ordered=orderedChoices(options,a.questionOrders?.[page]);shell(`<div class="pre-read"><div class="pre-read-top"><span class="tag">🔎 BEFORE YOU READ</span><span class="pre-read-mini-progress" aria-label="Question ${page+1} of 2">QUESTION ${page+1} OF 2 <span class="pre-read-dot ${page===0?'active':'finished'}"></span><span class="pre-read-dot ${page===1?'active':''}"></span></span></div><h2>❓ Read Your Detective Question</h2><p class="pre-read-intro">Figure out what to look for. The story will help you discover the answer!</p><div class="pre-read-mission"><span>🎯 YOUR DETECTIVE QUESTION</span><strong>${escapeHtml(c.question)}</strong></div><section class="pre-read-card"><h3>${page+1}. ${prompt}</h3><p class="pre-read-instruction">Choose one answer.</p><div class="pre-read-choices" role="radiogroup" aria-label="${escapeHtml(prompt)}">${ordered.map(({text:choice,original:i})=>`<label class="pre-read-option ${chosen===i?'is-selected':''}"><input type="radio" name="preReadChoice" value="${i}" ${chosen===i?'checked':''} onchange="choosePreRead(${page},${i})"><span class="pre-read-radio" aria-hidden="true">${chosen===i?'✓':''}</span><span>${escapeHtml(choice)}</span></label>`).join('')}</div><p id="questionFeedback" class="pre-read-feedback" role="status" aria-live="polite"></p><div class="pre-read-actions">${page===1?'<button type="button" onclick="state.answers.preReadPage=0;render()">← Previous Question</button>':'<span class="tiny">Think like a detective!</span>'}<button type="button" class="primary" onclick="checkPreReadPage()">${page===0?'Next Question →':'Restate My Question →'}</button></div></section></div>`)}
else if(s===1){const ids=a.evidenceIndices||[],sentences=storySentences(c.passage);shell(`<h2>🔍 Step 2: Collect & Organize Evidence</h2><p>Click sentences in the PDF above to collect clues. Then put your strongest clues in the Evidence Board. Fill the first two boxes to continue. The third is optional${state.caseIndex===2?' — use all four boxes to show the life cycle':''}.</p>${evidenceBoardMarkup(true)}<div class="panel"><h3>🔎 My Collected Sentences (${ids.length}/${clueLimit()})</h3>${ids.map((id,n)=>`<div class="plan-part"><p><strong>Clue ${n+1}:</strong> ${escapeHtml(sentences[id])}</p>${a.cluesChecked?`<p>${clueFeedback(id)}</p>`:''}<button onclick="pickEvidence(${id})">Remove clue</button></div>`).join('')||'<p>Click a sentence in the story above to collect it.</p>'}${clueLimit()<maxClues()?`<button onclick="addClueSlot()">＋ Space for Another Clue</button>`:''}${clueCoverageNote(ids)}${a.cluesChecked&&!ids.some(id=>clueRating(id)==='strong')?`<label for="clueReflection">How could one clue help answer the question?</label><textarea id="clueReflection" oninput="changeClueReflection(this.value)">${escapeHtml(a.clueReflection||'')}</textarea>`:''}<p role="status">${escapeHtml(a.clueMessage||'')}</p><div class="toolbar"><button ${ids.length?'':'disabled'} onclick="checkMyClues()">🔎 Check My Clues</button><button class="primary" ${boardReady()?'':'disabled'} onclick="continueWithClues()">Organize My Evidence →</button></div></div>`)}
else if(s===2){shell(`<h2>✏️ Step 2: R — Restate</h2><p>Start your answer using words from the question.</p><div class="wordbank"><strong>Sentence starter:</strong><p>${escapeHtml(c.starter.trim().replace(/[.\s]+$/,''))} ...</p></div><p>Read the starter. In the next step, you'll finish it with your own answer.</p><button class="primary" onclick="saveRestate()">Use This Starter →</button>`)}
else if(s===3){const starter=answerStarter();const current=a.answerDraft===undefined?(a.answer||''):a.answerDraft;shell(`<h2>✏️ Step 3: A — Answer</h2><p>Finish the sentence starter with a clear answer. You will add evidence in the next steps.</p><div class="answer-mission">🎯 <strong>Your job:</strong> ${escapeHtml(answerMissions[state.caseIndex])} Save your supporting details for Cite and Explain.</div>${hintMarkup()}<label for="answerEnding">My answer</label><details class="spelling-helper"><summary>🔤 Need spelling help?</summary><p>See a red underline? Right-click the word (or tap with two fingers) to see suggested spellings. Choose the one that matches what you mean.</p></details><textarea spellcheck="true" autocorrect="on" autocomplete="on" id="answerEnding" style="min-height:150px" placeholder="${escapeHtml(starter)}..." oninput="state.answers.answerDraft=this.value;document.getElementById('answerFeedback').textContent=''">${escapeHtml(current)}</textarea><p id="answerFeedback" role="status" aria-live="polite" style="font-weight:bold"></p><p class="tiny">Finish the thought in your own words. End with punctuation.</p><button class="primary" onclick="saveAnswerStep()">Save My Answer →</button>`)}
else if(s===4){const type=state.caseIndex>=2?'article':'story';const ids=a.evidenceIndices||[];const sentences=storySentences(c.passage);shell(`<h2>📖 Step 5: C — Cite</h2><p><strong>Use your clues to prove your answer.</strong> You can cite one clue or more than one. There are different ways to introduce a quotation.</p>${evidenceBoardMarkup(false)}<div class="panel"><h3>✍️ How to Cite</h3><p><strong>1.</strong> Try: <strong>In the ${type}, it says,</strong> You can also write <strong>According to the ${type},</strong> or name the character who said it.</p><p><strong>2.</strong> Put <strong>“quotation marks”</strong> around the exact words you copy.</p><p><strong>3.</strong> Want to use another clue? Introduce it in your own words, too.</p><p class="tiny">Examples from a different text: In the ${type}, it says, “Maya opened her umbrella.” Or: Maya says, “It looks like rain.”</p></div><label for="citation"><strong>Write your own evidence sentence or sentences</strong></label><details class="spelling-helper"><summary>🔤 Need spelling help?</summary><p>See a red underline? Right-click the word (or tap with two fingers) to see suggested spellings. Choose the one that matches what you mean.</p></details>${linkingWordsPanel("citation")}<textarea spellcheck="true" autocorrect="on" autocomplete="on" id="citation" style="min-height:150px" placeholder="In the ${type}, it says, “...”" oninput="state.answers.noteEvidence=this.value">${escapeHtml(a.noteEvidence||'')}</textarea><p id="citationFeedback" role="status" style="display:none;background:#fff4cc;border-left:5px solid #d49b1d;padding:12px;margin:10px 0;font-weight:bold"></p><p class="tiny">The writing box starts blank. Use one or more of your clues above.</p><button class="primary" onclick="saveCite()">I Cited My Evidence →</button>`)}
else if(s===5){shell(`<h2>💡 Step 6: E — Explain</h2><p><strong>Your mission: Connect the clue!</strong></p><p>Tell your reader <strong>WHY</strong> your proof supports your answer. Don't just repeat the quote. Tell what it means!</p>${a.citationSuggestion?`<p class="tiny">✏️ Citation tip: ${escapeHtml(a.citationSuggestion)}</p>`:''}<div class="wordbank"><strong>📝 Your Answer</strong><p>${escapeHtml(a.answer||'')}</p><strong>🔎 Your Proof</strong><p>${escapeHtml(a.noteEvidence||'')}</p></div><div class="panel"><strong>Remember:</strong><p><strong>Cite</strong> = What does the text say?</p><p><strong>Explain</strong> = What does that clue show? How does it prove your answer?</p></div>${evidenceBoardMarkup(false)}${explainHintMarkup()}${linkingWordsPanel("explanation")}<label for="explanation"><strong>My explanation</strong></label><details class="spelling-helper"><summary>🔤 Need spelling help?</summary><p>See a red underline? Right-click the word (or tap with two fingers) to see suggested spellings. Choose the one that matches what you mean.</p></details><textarea spellcheck="true" autocorrect="on" autocomplete="on" id="explanation" placeholder="This shows that..." oninput="state.answers.explanation=this.value">${escapeHtml(a.explanation||'')}</textarea><p class="tiny">Try starting with <strong>This shows that...</strong> Use your own words.</p><p id="explanationFeedback" role="status"></p><button class="primary" onclick="saveExplainStep()">Save My Explanation →</button>`)}
else if(s===6){renderRevisionStep();}

else{shell(`<div class="success"><h2>🧑‍🏫 Teacher Check</h2><p>Show your teacher your Chromebook. Your teacher will read your answer and choose what happens next.</p></div><div class="panel"><h3>❓ Question</h3><p>${escapeHtml(c.question)}</p><h3>✍️ Student’s Complete Response</h3><div class="teacher-response" role="region" aria-label="Student complete response">${escapeHtml(state.answers.full||'No final response was saved. Use Needs Revision to return to writing.')}</div><details><summary>🗒️ View the student's planning notes</summary><div class="teacher-notes"><strong>Sentence Starter:</strong><p>${escapeHtml(state.answers.restate||"Not written")}</p><strong>Answer the Question:</strong><p>${escapeHtml(state.answers.answer||'Not written')}</p><strong>Find Your Proof:</strong><p>${escapeHtml(state.answers.noteEvidence||state.answers.evidence||'Not selected')}</p><strong>Explain and Wrap Up:</strong><p>${escapeHtml(state.answers.noteExplain||state.answers.explanation||'Not written')}</p></div></details><details><summary>📖 View the story</summary><p class="tiny">${escapeHtml(c.author)} · ${escapeHtml(c.credit)}</p>${pdfReader(c)}</details><h3>Student reflection</h3><p>Which detective skill did you practice most?</p><div class="toolbar">${['I answered the question.','I found strong clues.','I explained my evidence.','I revised my writing.'].map(t=>`<button type="button" onclick="chooseReflection('${t}')">${t}</button>`).join('')}</div><p id="reflectionStatus" class="tiny">${escapeHtml(a.reflection||'Choose one skill you practiced.')}</p>${teacherRevisionChoices()}<h3>Teacher feedback</h3><div class="toolbar"><button type="button" onclick="teacherQuickFeedback('praise')">🌟 Strong RACE</button><button type="button" onclick="teacherQuickFeedback('evidence')">🔎 Great evidence</button><button type="button" onclick="teacherQuickFeedback('explain')">💡 Explain more</button><button type="button" onclick="teacherQuickFeedback('answer')">❓ Answer question</button><button type="button" onclick="teacherQuickFeedback('mechanics')">✏️ Check conventions</button></div><p class="tiny">Review the student’s answer, selected proof, explanation, and capitalization/punctuation. The student can revise if needed.</p><label for="teacherFeedback">Teacher's note (optional)</label><details class="spelling-helper"><summary>🔤 Need spelling help?</summary><p>See a red underline? Right-click the word (or tap with two fingers) to see suggested spellings. Choose the one that matches what you mean.</p></details><textarea spellcheck="true" autocorrect="on" autocomplete="on" id="teacherFeedback" placeholder="One strength and one next step..." oninput="state.answers.teacherFeedback=this.value">${escapeHtml(state.answers.teacherFeedback||'')}</textarea><div class="toolbar"><button onclick="teacherRevise()">✏️ Revise writing</button><button class="primary" onclick="teacherApprove()">✓ Approve response</button></div><div id="teacherDecision" class="warning">Waiting for teacher review. The next case is locked until approval.</div></div><div class="toolbar"><button class="primary" id="nextCase" disabled onclick="resumeCase(${(state.caseIndex+1)%cases.length})">Next Case →</button><button onclick="window.print()">🖨️ Print</button><button onclick="exportResponse()">⬇️ Export Response</button><button onclick="home()">Case Desk</button></div>`)} }function teacherSendTo(step){const f=$('teacherFeedback');if(f)state.answers.teacherFeedback=f.value;state.answers.revisionTarget=step;state.answers.needsRebuild=true;state.answers.completed=false;state.step=step;saveProgress();render();}
function teacherRevisionChoices(){return `<div class="panel"><h3>✏️ What should the student fix?</h3><p class="tiny">Choose a RACE step to revisit. The student's notes and final paragraph are kept, but the paragraph will be marked for updating.</p><div class="toolbar"><button onclick="teacherSendTo(3)">A · Fix Answer</button><button onclick="teacherSendTo(1)">🔎 Fix Clues</button><button onclick="teacherSendTo(4)">C · Fix Citation</button><button onclick="teacherSendTo(5)">E · Fix Explanation</button><button onclick="teacherSendTo(6)">✍️ Fix Final Paragraph</button></div></div>`}
function revisionReminder(){const a=state.answers;return a.needsRebuild?'<div class="warning" role="status"><strong>✏️ Revision needed:</strong> Your notes may have changed. Check your final paragraph and use the sentence strips or edit the paragraph yourself. Then send it back to your teacher.</div>':''}
function checklistMarkup(){const a=state.answers;return `<div class="panel"><h3>🔎 My RACE Self-Check</h3><p>Read your paragraph and check each box before teacher review.</p>${[['answer','I answered the whole question.'],['evidence','I used a clue from the story.'],['citation','I introduced my evidence clearly.'],['explain','I explained how my clue supports my answer.'],['reread','I reread my paragraph for capitals and punctuation.']].map(([id,t])=>`<label style="display:block;margin:9px 0;font-weight:normal"><input type="checkbox" ${a.selfChecks?.[id]?'checked':''} onchange="setSelfCheck('${id}',this.checked)"> ${t}</label>`).join('')}</div>`}
function setSelfCheck(id,checked){state.answers.selfChecks=state.answers.selfChecks||{};state.answers.selfChecks[id]=checked;saveProgress()}
function teacherRevise(){const f=$('teacherFeedback');if(f)state.answers.teacherFeedback=f.value;state.step=6;render();setTimeout(()=>{const x=document.getElementById("full");if(x)x.focus()},0)}function teacherApprove(){
 const f=$('teacherFeedback');if(f)state.answers.teacherFeedback=f.value;
 state.answers.completed=true;state.answers.needsRebuild=false;saveProgress();caseClosed();
}
function feedback(correct,msg){if(state.selection<0)return '';return state.selection===correct?`<div class="success">✅ ${msg}</div><button class="primary" onclick="next()">Next Mission →</button>`:`<div class="warning">🔎 Not quite. Reread the case file and try another clue.</div>`}function saveText(field,nextStep){const val=$(field).value.trim();if(val.length<15){alert('Write a complete sentence before moving on.');return}if(!/^[A-Z]/.test(val)||!/[.!?]$/.test(val)){alert('Check that your sentence starts with a capital letter and ends with punctuation.');return}if(!caseRelevant(val,cases[state.caseIndex])){alert('Your sentence needs to answer this case question. Look at the question and try again.');return}state.answers[field]=val;state.step=nextStep;render()}function caseRelevant(v,c){return v.trim().split(/\s+/).length>=6}function showHint(){const c=cases[state.caseIndex];$('hint').innerHTML=`<div class="wordbank"><strong>Writing tips:</strong><p>Your answer begins: ${escapeHtml(state.answers.restate||"Return to Mission 1 to write it.")}</p><p>Find a sentence in the passage that proves your answer. Begin with: The text says, “...”</p><p>This shows that ...</p></div>`}function review(){preserveDraft();const v=$('full').value.trim();state.answers.full=v;const c=cases[state.caseIndex];const sentences=v.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);const checks=[{name:'A complete response',ok:sentences.length>=2&&v.split(/\s+/).length>=18,tip:'Write at least two meaningful sentences: your answer and evidence/explanation.'},{name:'Capital letter and punctuation',ok:/^[A-Z]/.test(v)&&/[.!?]$/.test(v),tip:'Start with a capital letter and finish with punctuation.'},{name:'Enough writing to review',ok:v.trim().split(/\s+/).length>=18,tip:'Write a fuller answer that includes evidence and an explanation.'},{name:'Introduces text evidence',ok:/\b(text|passage|story|author)\b.{0,45}\b(says|states|explains|mentions|shows|reads|describes)\b|according to|for example|for instance|[“”"]/.test(v.toLowerCase()),tip:'Introduce evidence with a phrase such as “The text says...” or “According to the passage...”'},{name:'Explains the evidence',ok:/\b(this shows|this means|this proves|this explains|because|therefore|as a result)\b/i.test(v)&&sentences.length>=3,tip:'Add a separate sentence explaining how the evidence supports your answer. Try “This shows...”'}];$('reviewPanel')?.remove();const div=document.createElement('div');div.id='reviewPanel';div.className='panel';div.innerHTML=`<h2>📝 Detective Writing Review</h2><p><strong>${checks.filter(x=>x.ok).length} of ${checks.length} writing checks detected.</strong> These are writing clues, not a grade. The computer cannot reliably decide whether your evidence and explanation are accurate.</p>${checks.map(x=>`<div class="${x.ok?'success':'warning'}"><strong>${x.ok?'✓ Looks good':'↻ Revisit'}: ${x.name}</strong><div>${x.ok?'Check that it makes sense.':x.tip}</div></div>`).join('')}<h3>Read and verify your evidence</h3><p>Does your evidence come from the passage, and does your explanation really prove your answer? Compare your writing with the case file above.</p><label style="font-weight:normal"><input type="checkbox" id="verified"> I checked that my evidence is accurate and my explanation makes sense.</label><div class="toolbar"><button onclick="revise()">✏️ Revise My Writing</button><button class="primary" onclick="finish()">Submit for Teacher Review →</button></div><p class="tiny">You can revise even when all checks are green. Your final mission is to show your response to your teacher.</p>`;$('full').after(div);div.scrollIntoView({behavior:'smooth',block:'start'})}function revise(){$('reviewPanel')?.remove();$('full').focus()}function finish(){state.step=7;render()}
document.addEventListener('input',function(e){if(!e.target||!e.target.id)return;const id=e.target.id;if(['full','answer','answerEnding','explanation','citation','noteAnswer','noteEvidence','noteExplain','questionJob','teacherFeedback'].includes(id)){const k=id==='citation'?'noteEvidence':id==='answerEnding'?'answerDraft':id==='noteAnswer'?'answer':id;state.answers[k]=e.target.value;saveProgress()}});
try{const old=JSON.parse(localStorage.getItem('rd95')||'{}');if(old.mode)state.mode=old.mode}catch(e){}home();
</script></body></html>
